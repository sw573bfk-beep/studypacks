          "Flashcards, quick questions, practice and the timed exam",
          "Join any class game with a code",
          "My Study: exam countdown, day-by-day plan and streak",
          "1 pack request a week"
        ] },
      { id: "plus", name: "Plus", price: "$2 a month", note: "The bit that makes you improve.",
        perks: [
          "Everything in Free",
          "Guided session - told exactly what to do, one step at a time",
          "Your weak 10 - drills the exact questions you keep getting wrong",
          "Spaced repetition - wrong answers come back until they stick",
          "Exam readiness score",
          "Host 1 class game a day",
          "2 pack requests a day"
        ] },
      { id: "pro", name: "Pro", price: "$5 a month", note: "For the week before the exam.",
        perks: [
          "Everything in Plus",
          "Mock exam - timed, marked, with a breakdown of which topics lost marks",
          "Unlimited class games",
          "5 pack requests a day"
        ] }
    ];

    var cards = tiers.map(function (t) {
      var on = (S.plan === t.id);
      return '<div class="sheet" style="flex:1;min-width:200px' + (on ? ";border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)" : "") + '">' +
        '<span class="kicker">' + (on ? "Your plan" : t.price) + '</span>' +
        '<h2 style="margin:4px 0 2px">' + esc(t.name) + '</h2>' +
        '<p class="help" style="margin:0 0 10px">' + esc(t.note || "") + '</p>' +
        '<ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.6">' +
          t.perks.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") +
        "</ul></div>";
    }).join("");

    var codeBox = "";
    if (!S.user) {
      codeBox = '<div class="sheet" style="margin-bottom:18px">' +
        '<h2>Have a code?</h2>' +
        '<p class="lead">Sign in first, then you can enter a Plus or Pro code.</p>' +
        '<button class="btn btn-primary" onclick="goAuth(\'plans\')">Sign in</button></div>';
    } else if (S.plan === "pro") {
      codeBox = '<div class="sheet" style="margin-bottom:18px"><p class="lead">You already have Pro. Nice.</p></div>';
    } else {
      var locked = S.planLockedUntil && new Date(S.planLockedUntil) > new Date();
      if (locked) {
        var mins = Math.ceil((new Date(S.planLockedUntil) - new Date()) / 60000);
        codeBox = '<div class="sheet" style="margin-bottom:18px">' +
          '<h2>Enter a code</h2>' +
          '<p class="lead">Too many wrong attempts. Try again in about ' + mins + ' minute' + (mins === 1 ? "" : "s") + '.</p></div>';
      } else {
        codeBox = '<div class="sheet" style="margin-bottom:18px">' +
          '<h2>Enter a code</h2>' +
          '<p class="lead">Type the 6 numbers, then tap Unlock.</p>' +
          '<div class="joinrow" style="margin-top:12px">' +
            '<input id="planCode" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="6" ' +
              'placeholder="e.g. 012269" autocomplete="one-time-code" ' +
              'style="letter-spacing:4px;font-weight:700;font-size:18px">' +
            '<button class="btn btn-primary" type="button" id="planGo" onclick="redeemCode()">Unlock</button>' +
          '</div></div>';
      }
    }

    return '<section class="hero" style="padding-bottom:0"><h1>Plans</h1>' +
      current + '</section>' +
      '<div class="panel">' + msg + trialNotice() + codeBox +
        '<div style="display:flex;flex-wrap:wrap;gap:14px">' + cards + '</div>' +
        howToPay() + teacherBox() +
      '</div>';
  }

  // Everyone gets a week of the full thing. Worth saying loudly, because it
  // is the cheapest way to show what Plus and Pro actually do.
  function trialNotice() {
    if (S.plan === "trial" && S.trialEnds) {
      var d = Math.ceil((new Date(S.trialEnds).getTime() - Date.now()) / 86400000);
      if (d > 0) {
        return '<div class="trialbar" style="font-size:15px;padding:14px 16px">' +
          '<strong>Your free week is running</strong> &middot; ' + d +
          (d === 1 ? " day" : " days") + ' left. You have everything Pro has, ' +
          'with 3 pack requests and 1 class game a day.</div>';
      }
    }
    if (S.plan === "plus" || S.plan === "pro") return "";
    return '<div class="trialbar" style="font-size:15px;padding:14px 16px">' +
      '<strong>Every new account gets a free week</strong> &middot; everything Pro has, ' +
      'with 3 pack requests and 1 class game a day. No code needed - it starts by itself.</div>';
  }

  function howToPay() {
    return '<div class="sheet" style="margin-top:18px">' +
      '<span class="kicker">Getting a code</span><h2>How does it work?</h2>' +
      '<p class="lead" style="margin-bottom:12px">Codes come from me directly - there is no card payment on the site yet.</p>' +
      '<ol style="margin:0;padding-left:20px;font-size:15px;line-height:1.8">' +
        '<li>Find me at school, or message me</li>' +
        '<li>Pay <strong>$2</strong> for 30 days of Plus, or <strong>$5</strong> for 30 days of Pro</li>' +
        '<li>I give you a 6-digit code</li>' +
        '<li>Type it in the box above - your 30 days start from that moment</li>' +
        '<li>When it runs out you go back to Free. Another code adds another 30 days</li>' +
      '</ol>' +
      '<p class="help" style="margin-top:14px">A code does nothing until someone enters it, so there is no ' +
      'rush to use one the day you get it. Each code works once, on one account. ' +
      'If you pay again before yours runs out, the new 30 days get added on the end - ' +
      'you never lose days by paying early.</p></div>';
  }

  function teacherBox() {
    if (S.teacherSent) {
      return '<div class="sheet" style="margin-top:18px">' +
        '<span class="kicker">Teachers</span><h2>Thanks - that is on its way to me</h2>' +
        '<p class="lead" style="margin-bottom:0">I will get back to you about codes for your class, usually within a day.</p>' +
      '</div>';
    }
    return '<div class="sheet" style="margin-top:18px">' +
      '<span class="kicker">Teachers</span><h2>Want this for your class?</h2>' +
      '<p class="lead">If you teach a class that would use this, tell me what you need and I will sort out codes for all of them. ' +
      'Cheaper per student than buying them one at a time.</p>' +
      '<div class="sheet" style="background:#fbfbfd;margin-top:14px">' +
        '<div class="field"><label for="tName">Your name</label>' +
          '<input id="tName" placeholder="Ms Taylor"></div>' +
        '<div class="field"><label for="tEmail">Email</label>' +
          '<input id="tEmail" type="email" placeholder="you@school.edu.au"></div>' +
        '<div class="field"><label for="tSchool">School</label>' +
          '<input id="tSchool" placeholder="Which school"></div>' +
        '<div class="field"><label for="tClass">What class, and how many students?</label>' +
          '<input id="tClass" placeholder="Year 8 Maths, about 26 students"></div>' +
        '<div class="field"><label for="tNeed">Anything else?</label>' +
          '<textarea id="tNeed" rows="3" placeholder="When your exams are, what topics you want covered, anything you need."></textarea></div>' +
        '<button class="btn btn-primary btn-lg" id="tGo">Send it</button>' +
        (S.teacherMsg ? '<div class="authmsg bad">' + esc(S.teacherMsg) + '</div>' : "") +
      '</div></div>';
  }

  function wireTeacher() {
    var b = document.getElementById("tGo");
    if (!b) return;
    b.addEventListener("click", function () {
      var name = val("tName"), email = val("tEmail"),
          school = val("tSchool"), cls = val("tClass"), need = val("tNeed");
      if (!name || !email) {
        S.teacherMsg = "I need at least your name and an email to get back to you.";
        render(); return;
      }
      b.disabled = true; b.textContent = "Sending...";
      var body = "TEACHER ENQUIRY\n===============\n\n" +
        "Name: " + name + "\nEmail: " + email + "\nSchool: " + (school || "(not given)") + "\n" +
        "Class: " + (cls || "(not given)") + "\n\n" + (need || "");
      fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          access_key: FORM_KEY,
          subject: "TEACHER: " + name + (school ? " - " + school : ""),
          from_name: "StudyPacks",
          name: name, contact: email, message: body
        })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.success) { S.teacherSent = true; S.teacherMsg = null; }
        else S.teacherMsg = "That did not send. Email me directly instead.";
        render();
      })["catch"](function () {
        S.teacherMsg = "Could not reach the server. Email me directly instead.";
        render();
      });
    });
  }

  function wirePlans() {
    var btn = document.getElementById("planGo");
    if (btn) btn.addEventListener("click", redeemCode);
    var inp = document.getElementById("planCode");
    if (inp) inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") redeemCode();
    });
    wireTeacher();
  }

  function redeemCode() {
    if (!SB) {
      S.planMsg = { ok: false, text: "Accounts are not connected yet." };
      render(); return;
    }
    if (!S.user) {
      S.planMsg = { ok: false, text: "Sign in first, then enter your code." };
      render(); return;
    }
    var inp = document.getElementById("planCode");
    var raw = inp ? (inp.value || "") : "";
    var code = String(raw).replace(/[^0-9]/g, "");
    if (code.length !== 6) {
      S.planMsg = { ok: false, text: "Enter a 6-digit code. You entered " + (code.length ? (code.length + " digit" + (code.length === 1 ? "" : "s")) : "nothing") + "." };
      render(); return;
    }
    if (S.planLockedUntil && new Date(S.planLockedUntil) > new Date()) {
      S.planMsg = { ok: false, text: "You are locked out for a bit. Try again later." };
      render(); return;
    }

    var btn = document.getElementById("planGo");
    if (btn) { btn.disabled = true; btn.textContent = "Checking..."; }

    function fail(msg) {
      S.planMsg = { ok: false, text: msg || "Something went wrong. Try again." };
      render();
    }

    // The whole check happens on the server. The browser never sees the list
    // of codes and cannot write a plan for itself - if it could, anyone could
    // read the codes out of the page or just set themselves to Pro.
    SB.rpc("redeem_plan_code", { p_code: code }).then(function (res) {
      if (res.error) { fail("Could not check that code just then. Try again."); return; }
      var r = res.data || {};
      if (r.locked_until) S.planLockedUntil = r.locked_until;
      if (r.ok) {
        S.plan = r.plan;
        S.planLockedUntil = null;
        S.planMsg = { ok: true, text: r.message || "Unlocked. Enjoy." };
        updateAuthArea();
        render();
      } else {
        fail(r.message || "That code is not valid.");
      }
    })["catch"](function () {
      fail("Could not reach the server. Try again.");
    });
  }


  function render() {
    updateAuthArea();
    if (S.view === "game") { app.innerHTML = gameView(); wireGame(); return; }
    if (S.view === "auth") { app.innerHTML = authView(); wireAuth(); return; }
    if (S.view === "admin") { app.innerHTML = adminView(); wireAdmin(); return; }
    if (S.view === "plans") { app.innerHTML = plansView(); wirePlans(); return; }
    if (S.view === "library") { library(); return; }
    if (S.view === "request") { app.innerHTML = requestView(); wireRequest(); return; }

    var p = pack();
    if (!p) { go("library"); return; }

    // A guided session takes over the whole page - no tabs, nothing to choose.
    if (S.session) {
      document.documentElement.setAttribute("data-theme", p.theme || "purple");
      bannerEl.innerHTML = ""; navEl.innerHTML = "";
      app.innerHTML = '<div class="panel">' + sessionView(p) + '</div>';
      wireSession(p);
      return;
    }

    // The mock exam takes over the page the same way.
    if (S.mock) {
      document.documentElement.setAttribute("data-theme", p.theme || "purple");
      bannerEl.innerHTML = ""; navEl.innerHTML = "";
      app.innerHTML = '<div class="panel">' + mockView(p) + '</div>';
      wireMock();
      return;
    }

    packChrome(p);

    var inner;
    if (S.tab === "home") inner = home(p);
    else if (S.tab === "study") inner = studyView(p);
    else if (S.tab === "overview") inner = overview(p);
    else if (S.tab.indexOf("unit:") === 0) inner = unitView(p, parseInt(S.tab.split(":")[1], 10));
    else if (S.tab === "quick") inner = quick(p);
    else if (S.tab === "practice") inner = practice(p);
    else if (S.tab === "cards") inner = cardsView(p);
    else if (S.tab === "exam") inner = examView(p);
    else inner = home(p);

    app.innerHTML = '<div class="panel">' + inner + '</div>';

    if (S.tab === "study") wireStudy(p);
    if (S.tab === "quick") wireQuick(p);
    if (S.tab === "practice") wirePractice(p);
    if (S.tab === "cards") wireCards(p);
    if (S.tab === "exam") wireExam(p);
  }

  checkPaidReturn();
  render();

  // Pick the session back up on load, so a signed-in student stays signed in.
  if (SB) {
    SB.auth.getSession().then(function (res) {
      var sess = res && res.data && res.data.session;
      S.user = sess ? sess.user : null;
      if (S.user) loadPlan(function () {
        loadCooldown(function () { updateAuthArea(); render(); });
      });
      else { S.plan = "free"; render(); }
    })["catch"](function () { render(); });

    SB.auth.onAuthStateChange(function (event, sess) {
      // Arriving from a "forgot password" email: Supabase signs them in just
      // long enough to set a new one, so send them straight to that screen.
      if (event === "PASSWORD_RECOVERY") {
        S.user = sess ? sess.user : S.user;
        S.authTab = "newpass";
        S.authMsg = null;
        updateAuthArea();
        go("auth");
        return;
      }
      var was = S.user && S.user.id;
      S.user = sess ? sess.user : null;
      if ((S.user && S.user.id) !== was) {
        S.adminRows = null; S.codeRows = null; S.codeSummary = null; S.memberRows = null;
        S.usage = null; S.doneOpen = false;
        if (S.user) loadPlan(function () { updateAuthArea(); });
        else { S.plan = "free"; updateAuthArea(); }
      }
    });

    // Some browsers land with the recovery details in the address bar before
    // the event above fires, so catch that too.
    if (/type=recovery/.test(location.hash) || /type=recovery/.test(location.search)) {
      S.authTab = "newpass";
      S.authMsg = null;
      go("auth");
    }
  }
})();
</script>
</body>
</html>
