    var notes = v("rNotes"), extra = v("rExtra"), ex = v("rExam");
    return {
      name: v("rName"),
      contact: v("rContact"),
      subject: v("rSubject"),
      year: v("rYear"),
      exam: ex,
      topics: v("rTopics"),
      notes: notes,
      extra: extra,
      wants: want,
      body: "STUDY PACK REQUEST\n==================\n\n" +
        "From: " + (v("rName") || "(no name given)") + "\n" +
        "Contact: " + (v("rContact") || "(none given)") + "\n" +
        "Subject: " + (v("rSubject") || "(not given)") + "\n" +
        "Year level: " + (v("rYear") || "(not given)") + "\n" +
        (ex ? "Exam details: " + ex + "\n" : "") +
        "Wants: " + (want.length ? want.join(", ") : "anything useful") + "\n\n" +
        "WHAT IS ON THE EXAM\n-------------------\n" + (v("rTopics") || "(not given)") + "\n\n" +
        (notes ? "THEIR NOTES / SLIDES\n--------------------\n" + notes + "\n\n" : "") +
        (extra ? "KEEPS GETTING STUCK ON\n----------------------\n" + extra + "\n" : "")
    };
  }

  function submitRequest() {
    var r = requestText();
    var out = document.getElementById("out");
    var btn = document.getElementById("mk");

    if (!r.subject && !r.year) {
      out.innerHTML = '<div class="outbox" style="border-color:#e4c9ac;background:#fff8ec">' +
        '<strong>Fill in at least the subject and year level</strong>' +
        '<p style="margin:6px 0 0;font-size:14px;color:var(--ink-soft)">Otherwise there is not enough to build a pack from.</p></div>';
      return;
    }

    var left = cooldownLeft();
    if (left) {
      out.innerHTML = '<div class="outbox" style="border-color:#c9cdfa;background:#eef0fe">' +
        '<h3 style="margin:0 0 4px;color:#3b3a6b">Not yet</h3>' +
        '<p style="margin:0;font-size:15px;color:#3b3a6b">Your next free request unlocks in ' + humanLeft(left) + '.' +
        (PAY_LINK ? ' Or request another now for ' + esc(PAY_PRICE) + '.' : '') + '</p>' +
        (PAY_LINK ? '<div style="margin-top:12px"><a class="btn btn-primary" href="' + esc(PAY_LINK) + '">Request another now</a></div>' : '') +
      '</div>';
      if (out.scrollIntoView) out.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }

    if (!SB || !S.user) { showCopyBox(out, r.body); return; }

    // The database decides what is acceptable, not this page. Slurs stop
    // here; ordinary swearing goes through with a note for the admin page.
    if (!S.reqChecked) {
      btn.disabled = true;
      btn.textContent = "Checking...";
      // Cap each field on its own. Joining them raw let a 33,000 character
      // paste push the short fields past the server's limit, so whatever was
      // typed in them was never looked at.
      SB.rpc("text_check", { p: checkText(r) })
        .then(function (chk) {
          var v = (chk && chk.data) || {};
          btn.disabled = false;
          btn.textContent = "Send my request";
          if (v.ok === false) {
            out.innerHTML = '<div class="outbox" style="border-color:#f0c4bb;background:#fdeeea">' +
              '<h3 style="margin:0 0 4px;color:#7d2f1f">That cannot be sent</h3>' +
              '<p style="margin:0;font-size:15px;color:#7d2f1f">There is a word in there we do not ' +
              'allow. Take it out and send it again - everything you typed is still on the page.</p>' +
              '<p style="margin:8px 0 0;font-size:13.5px;color:#7d2f1f">If you were quoting something ' +
              'from class, just describe it instead and we will still know what you mean.</p></div>';
            if (out.scrollIntoView) out.scrollIntoView({ behavior: "smooth", block: "start" });
            return;
          }
          S.reqChecked = v.hit === "flag" ? "swearing" : "clean";
          submitRequest();
        })["catch"](function () {
          // If the check cannot run, do not punish the student for it.
          btn.disabled = false;
          btn.textContent = "Send my request";
          S.reqChecked = "unchecked";
          submitRequest();
        });
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending...";

    SB.from("requests").insert({
      user_id: S.user.id,
      name: r.name || null,
      contact: r.contact || null,
      subject: r.subject || null,
      year_level: r.year || null,
      exam_info: r.exam || null,
      topics: r.topics || null,
      notes: r.notes || null,
      stuck_on: r.extra || null,
      wants: r.wants && r.wants.length ? r.wants : null,
      flagged: (S.reqChecked && S.reqChecked !== "clean") ? S.reqChecked : null,
      paid: false
    }).select().then(function (res) {
      btn.disabled = false;
      btn.textContent = "Send my request";
      S.reqChecked = null;

      if (res && res.error) {
        // The database enforces the 3-day limit, so this can fire even if the
        // page thought the student was clear.
        if (/RATE_LIMIT/i.test(res.error.message || "")) {
          loadCooldown(function () {
            var l = cooldownLeft();
            out.innerHTML = '<div class="outbox" style="border-color:#c9cdfa;background:#eef0fe">' +
              '<h3 style="margin:0 0 4px;color:#3b3a6b">That is all your requests for now</h3>' +
              '<p style="margin:0;font-size:15px;color:#3b3a6b">Your next request unlocks in ' +
              (l ? humanLeft(l) : "a little while") + '.</p></div>';
            if (out.scrollIntoView) out.scrollIntoView({ behavior: "smooth", block: "start" });
          });
          return;
        }
        showCopyBox(out, r.body,
          "Saving did not work just then, so here is your request to copy and send over manually.");
        return;
      }

      var rows = (res && res.data) || [];
      S.lastRequestAt = rows.length ? rows[0].created_at : new Date().toISOString();
      loadCooldown();   // refresh how many they have left
      notifyBeau(r);

      out.innerHTML = '<div class="outbox" style="border-color:#1a8a55;background:#e8f7ef">' +
        '<h3 style="margin:0 0 4px;color:#14603c">&#10003; Sent</h3>' +
        '<p style="margin:0;font-size:15px;color:#14603c">Your request is in. Packs usually come back within a day' +
        (r.contact ? ", and I will get it to you on " + esc(r.contact) : "") + '.</p></div>';

      // Clear what was about this pack, keep who they are - otherwise the next
      // request makes them type their own name and email in again.
      ["rSubject","rYear","rExam","rTopics","rNotes","rExtra"].forEach(function (id) {
        var e = document.getElementById(id); if (e) e.value = "";
      });
      var nEl = document.getElementById("rName"), cEl = document.getElementById("rContact");
      if (nEl) nEl.value = accountName();
      if (cEl) cEl.value = accountEmail();
      var fl = document.getElementById("rFiles"); if (fl) fl.innerHTML = "";
    })["catch"](function () {
      btn.disabled = false;
      btn.textContent = "Send my request";
      showCopyBox(out, r.body,
        "Could not reach the server - here is your request to copy and send over manually.");
    });
  }

  // Fire-and-forget email so a request does not sit unnoticed. The request is
  // already safely in the database by this point, so if this fails it changes
  // nothing for the student - they still get their confirmation.
  function notifyBeau(r) {
    if (!FORM_KEY) return;
    try {
      fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          access_key: FORM_KEY,
          subject: "Pack request: " + (r.subject || "?") + " " + (r.year || "") +
                   (r.name ? " - " + r.name : ""),
          from_name: "StudyPacks",
          name: r.name || "(no name)",
          contact: r.contact || "(none given)",
          from_account: (S.user && S.user.email) || "(unknown)",
          message: r.body + "\n\n---\nSent from the account " +
                   ((S.user && S.user.email) || "unknown") +
                   ".\nIt is saved in the admin area of the site too."
        })
      })["catch"](function () {});
    } catch (e) {}
  }

  function showCopyBox(out, text, note) {
    out.innerHTML = '<div class="outbox"><h3 style="margin:0 0 4px">Ready to send</h3>' +
      '<p style="margin:0 0 14px;font-size:14px;color:var(--ink-soft)">' +
      esc(note || "Copy this and send it over. Packs usually come back within a day.") + '</p>' +
      '<pre id="rt">' + esc(text) + '</pre>' +
      '<button class="btn btn-primary" id="cp">Copy to clipboard</button></div>';

    document.getElementById("cp").addEventListener("click", function () {
      var b = this;
      function done() { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy to clipboard"; }, 1800); }
      function fb() {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch (e) { b.textContent = "Select the text and copy"; }
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fb);
      else fb();
    });
    if (out.scrollIntoView) out.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* ---------------- render ---------------- */

  /* ---------------- class game ---------------- */
  /* Host needs an account. Players just need the code and a nickname, the same
     way Kahoot works - a class of 25 cannot all stop and sign up. */

  var GAME_QS = 10;          // questions per game
  var POINTS_RIGHT = 100;
  var gamePollId = null;

  function stopGamePoll() { if (gamePollId) { clearInterval(gamePollId); gamePollId = null; } }

  function gamePack() {
    var g = S.game; if (!g) return null;
    for (var i = 0; i < PACKS.length; i++) if (PACKS[i].id === g.packId) return PACKS[i];
    return null;
  }
  function gameQuestion() {
    var g = S.game, p = gamePack();
    if (!g || !p || !g.questions) return null;
    var idx = g.questions[g.questionNo];
    return (p.quick || [])[idx] || null;
  }

  function startGamePoll() {
    stopGamePoll();
    gamePollId = setInterval(function () {
      var g = S.game;
      if (!g || !g.id) return;
      SB.from("games").select("status,question_no").eq("id", g.id).limit(1)
        .then(function (res) {
          var row = res && res.data && res.data[0];
          if (!row) return;
          var moved = (row.status !== g.status) || (row.question_no !== g.questionNo);
          g.status = row.status;
          if (row.question_no !== g.questionNo) {
            g.questionNo = row.question_no;
            g.chosen = null; g.scored = false;
          }
          SB.from("game_players").select("id,nickname,score,answered")
            .eq("game_id", g.id).order("score", { ascending: false })
            .then(function (r2) {
              g.players = (r2 && r2.data) || [];
              if (S.view === "game") render();
            });
          if (moved && S.view === "game") render();
        })["catch"](function () {});
    }, 2000);
  }

  window.hostGame = function (packId) {
    var p = null;
    for (var i = 0; i < PACKS.length; i++) if (PACKS[i].id === packId) p = PACKS[i];
    if (!p) return;
    var pool = (p.quick || []).map(function (_, i) { return i; });
    // shuffle, then take up to GAME_QS
    for (var k = pool.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1)); var t = pool[k]; pool[k] = pool[j]; pool[j] = t;
    }
    pool = pool.slice(0, Math.min(GAME_QS, pool.length));
    S.gameMsg = null;
    SB.rpc("create_game", { p_pack_id: packId, p_question_ids: pool }).then(function (res) {
      if (res.error) {
        var m = String(res.error.message || "");
        S.gameMsg = /HOST_NOT_ALLOWED/.test(m)
            ? "Hosting a game needs Plus or Pro - and every new account gets a free week of it."
          : /HOST_LIMIT/.test(m)
            ? "That is your class game for today. Plus gets one a day, Pro is unlimited."
          : /SIGN_IN_REQUIRED/.test(m)
            ? "Sign in first so the game knows who is running it."
          : "Could not start a game just then. Try again.";
        render(); return;
      }
      var row = res.data && res.data[0];
      S.game = { role: "host", id: row.game_id, code: row.code, packId: packId,
                 status: "lobby", questionNo: 0, questions: pool, players: [],
                 chosen: null, scored: false };
      startGamePoll();
      render();
    })["catch"](function () { S.gameMsg = "Could not reach the server."; render(); });
  };

  window.joinGame = function () {
    var code = (val("gCode") || "").replace(/\D/g, "");
    var nick = val("gNick");
    if (code.length !== 6) { S.gameMsg = "The code is 6 numbers."; render(); return; }
    if (!nick) { S.gameMsg = "Pick a nickname so people know who you are."; render(); return; }
    var b = document.getElementById("gJoin");
    if (b) { b.disabled = true; b.textContent = "Joining..."; }
    S.gameMsg = null;
    SB.rpc("join_game", { p_code: code, p_nick: nick }).then(function (res) {
      if (res.error) {
        var m = String(res.error.message || "");
        S.gameMsg = /NO_SUCH_GAME/.test(m) ? "No game with that code. Check it and try again."
                  : /NICKNAME_TAKEN/.test(m) ? "Someone in this game already has that name."
                  : /NICKNAME_NOT_OK/.test(m) ? "Pick a different nickname - that one will not fly in a classroom."
                  : /NICKNAME_REQUIRED/.test(m) ? "Pick a nickname."
                  : "Could not join just then.";
        render(); return;
      }
      var row = res.data && res.data[0];
      if (!row) { S.gameMsg = "Could not join just then."; render(); return; }
      // join_game returns its columns prefixed with out_ (out_player_id,
      // out_token, out_game_id, out_pack_id, out_status). Reading the
      // unprefixed names gave undefined for every one of them, so the
      // player joined on the server but their screen had no game, no pack
      // and no token - which is why they could never answer anything.
      var gameId = row.out_game_id || row.game_id;
      var packId = row.out_pack_id || row.pack_id;
      var playerId = row.out_player_id || row.player_id;
      var token = row.out_token || row.token || row.player_token;
      var status = row.out_status || row.status || "lobby";
      if (!gameId || !playerId || !token) {
        S.gameMsg = "Joined, but the game did not load properly. Try again.";
        render(); return;
      }
      S.game = { role: "player", id: gameId, code: code, packId: packId,
                 playerId: playerId, token: token, nickname: nick,
                 status: status, questionNo: 0, questions: null, players: [],
                 chosen: null, scored: false };
      // players need the question order too
      SB.from("games").select("question_ids,question_no,status").eq("id", row.game_id).limit(1)
        .then(function (r2) {
          var g2 = r2 && r2.data && r2.data[0];
          if (g2) {
            S.game.questions = g2.question_ids || [];
            S.game.questionNo = g2.question_no || 0;
            S.game.status = g2.status;
          }
          startGamePoll();
          render();
        });
    })["catch"](function () { S.gameMsg = "Could not reach the server."; render(); });
  };

  window.gameAnswer = function (j) {
    var g = S.game, q = gameQuestion();
    if (!g || !q || g.chosen !== null) return;
    g.chosen = j;
    var right = (j === q.answer);
    if (right && g.role === "player" && !g.scored) {
      g.scored = true;
      // A silent catch here is how a whole broken game went unnoticed: the
      // player saw "correct" while the server recorded nothing.
      SB.rpc("score_answer", { p_player: g.playerId, p_token: g.token, p_points: POINTS_RIGHT })
        .then(function (res) {
          if (res && res.error) {
            g.scored = false;
            S.gameMsg = "That point did not save. Your score may be behind.";
            render();
          }
        })["catch"](function () {
          g.scored = false;
          S.gameMsg = "That point did not save. Your score may be behind.";
          render();
        });
    }
    render();
  };

  window.gameAdvance = function (status) {
    var g = S.game; if (!g || g.role !== "host") return;
    var next = status === "next" ? g.questionNo + 1 : g.questionNo;
    var st = status === "next"
      ? (next >= g.questions.length ? "finished" : "playing")
      : status;
    SB.rpc("set_game_state", { p_game: g.id, p_status: st, p_question_no: next })
      .then(function () {
        g.status = st; g.questionNo = next; g.chosen = null; g.scored = false;
        render();
      })["catch"](function () {});
  };

  window.leaveGame = function () {
    stopGamePoll(); S.game = null; S.gameMsg = null; go("library");
  };

  function board(g, limit) {
    var rows = (g.players || []).slice(0, limit || 99);
    if (!rows.length) return '<p class="help">Nobody yet.</p>';
    return '<ol class="board">' + rows.map(function (pl, i) {
      var me = (g.role === "player" && pl.id === g.playerId);
      return '<li' + (me ? ' class="me"' : '') + '><span class="bpos">' + (i + 1) + '</span>' +
        '<span class="bname">' + esc(pl.nickname) + (me ? " (you)" : "") + '</span>' +
        '<span class="bscore">' + pl.score + '</span></li>';
    }).join("") + '</ol>';
  }

  function gameView() {
    document.documentElement.removeAttribute("data-theme");
    bannerEl.innerHTML = ""; navEl.innerHTML = "";
    var g = S.game;
    var msg = S.gameMsg ? '<div class="authmsg bad">' + esc(S.gameMsg) + '</div>' : "";

    /* ---- not in a game yet ---- */
    if (!g) {
      var hostBlock;
      if (!S.user) {
        hostBlock = '<div class="sheet"><span class="kicker">Run one</span><h2>Host a game</h2>' +
          '<p class="lead">You need an account to host. Joining one needs nothing at all.</p>' +
          '<button class="btn btn-primary" onclick="goAuth(\'game\')">Sign in to host</button></div>';
      } else if (!canHost()) {
        hostBlock = '<div class="sheet"><span class="kicker">Run one</span><h2>Host a game</h2>' +
          '<p class="lead">Hosting is for Plus and Pro. Join games is free for everyone.</p>' +
          '<button class="btn btn-primary" onclick="go(\'plans\')">See plans</button></div>';
      } else {
        hostBlock = '<div class="sheet"><span class="kicker">Run one</span><h2>Host a game</h2>' +
          '<p class="lead">Pick a pack. Everyone answers the same questions and the scores go up live.</p>' +
          '<div class="hostpicks">' + PACKS.map(function (p) {
            var n = (p.quick || []).length;
            return '<button class="hostpick" onclick="hostGame(\'' + esc(p.id) + '\')"' +
              (n < 2 ? " disabled" : "") + '>' +
              '<strong>' + esc(p.emoji || "") + " " + esc(p.title) + '</strong>' +
              '<span>' + n + ' questions</span></button>';
          }).join("") + '</div></div>';
      }

      return '<section class="hero" style="padding-bottom:0"><h1>Class game</h1>' +
          '<p>Everyone on the same questions at once, scores climbing live. Good for the last ten minutes of a lesson.</p>' +
        '</section>' +
        '<div class="panel">' + msg +
          '<div class="sheet" style="margin-bottom:18px"><span class="kicker">Join one</span>' +
            '<h2>Got a code?</h2>' +
            '<div class="joinrow">' +
              '<input id="gCode" inputmode="numeric" maxlength="6" placeholder="6-digit code">' +
              '<input id="gNick" maxlength="20" placeholder="Your nickname">' +
              '<button class="btn btn-primary" id="gJoin">Join</button>' +
            '</div>' +
            '<p class="help" style="margin-top:10px">No account needed.</p>' +
          '</div>' + hostBlock +
        '</div>';
    }

    /* ---- lobby ---- */
    if (g.status === "lobby") {
      return '<div class="panel"><div class="sheet">' + msg +
        (g.role === "host"
          ? '<span class="kicker">Waiting to start</span><h2>Everyone go to this site and enter</h2>' +
            '<div class="gamecode">' + esc(g.code) + '</div>' +
            '<p class="lead">' + (g.players.length || 0) + ' in so far.</p>' +
            board(g) +
            '<div style="margin-top:18px">' +
              '<button class="btn btn-primary btn-lg" onclick="gameAdvance(\'playing\')"' +
                (g.players.length ? "" : " disabled") + '>Start the game</button> ' +
              '<button class="btn" onclick="leaveGame()">Cancel</button>' +
            '</div>'
          : '<span class="kicker">You are in</span><h2>Hang tight, ' + esc(g.nickname) + '</h2>' +
            '<p class="lead">Waiting for whoever is running it to start.</p>' +
            board(g) +
            '<div style="margin-top:18px"><button class="btn" onclick="leaveGame()">Leave</button></div>') +
      '</div></div>';
    }

    /* ---- finished ---- */
    if (g.status === "finished") {
      var top = (g.players || [])[0];
      var mine = null;
      (g.players || []).forEach(function (pl, i) { if (pl.id === g.playerId) mine = { pos: i + 1, score: pl.score }; });
      return '<div class="panel"><div class="sheet" style="text-align:center">' +
        '<span class="kicker">That is it</span><h2>Final scores</h2>' +
        (top ? '<p class="lead">' + esc(top.nickname) + ' takes it with ' + top.score + '.</p>' : "") +
        (mine ? '<p class="lead">You came ' + mine.pos + ' with ' + mine.score + '.</p>' : "") +
        board(g) +
        '<div style="margin-top:18px"><button class="btn btn-primary" onclick="leaveGame()">Done</button></div>' +
      '</div></div>';
    }

    /* ---- playing ---- */
    var q = gameQuestion();
    if (!q) {
      return '<div class="panel"><div class="sheet"><p class="lead">Waiting for the next question...</p>' +
        '<div style="margin-top:16px"><button class="btn" onclick="leaveGame()">Leave</button></div></div></div>';
    }
    var opts = q.options.map(function (o, j) {
      var cls = "opt";
      if (g.chosen !== null) {
        if (j === q.answer) cls += " right";
        else if (j === g.chosen) cls += " wrong";
      }
      return '<button class="' + cls + '" onclick="gameAnswer(' + j + ')"' +
        (g.chosen !== null ? " disabled" : "") + '>' +
        '<span class="mark">' + String.fromCharCode(65 + j) + '</span><span>' + esc(o) + '</span></button>';
    }).join("");

    return '<div class="panel">' +
      '<div class="gamehead"><span>Question ' + (g.questionNo + 1) + ' of ' + g.questions.length + '</span>' +
        '<span>Code ' + esc(g.code) + '</span></div>' +
      '<div class="mc"><div class="mc-q">' + esc(q.q) + '</div>' +
        '<div class="mc-opts">' + opts + '</div>' +
        (g.chosen !== null
          ? '<div class="mc-why"><strong>' +
              (g.chosen === q.answer ? "Correct." : "Not quite — it's " + esc(q.options[q.answer]) + ".") +
            '</strong> ' + esc(q.why || "") + '</div>'
          : "") +
      '</div>' +
      '<div class="sheet" style="margin-top:18px"><h2 style="font-size:19px">Scores</h2>' + board(g, 8) + '</div>' +
      (g.role === "host"
        ? '<div class="sessfoot"><button class="btn btn-primary btn-lg" onclick="gameAdvance(\'next\')">' +
            (g.questionNo + 1 >= g.questions.length ? "Finish and show scores" : "Next question") + '</button></div>'
        : '<p class="help" style="margin-top:16px">Waiting for the next question.</p>') +
    '</div>';
  }

  function wireGame() {
    var b = document.getElementById("gJoin");
    if (b) b.addEventListener("click", window.joinGame);
    var nick = document.getElementById("gNick");
    if (nick) nick.addEventListener("keydown", function (e) {
      if (e.key === "Enter") window.joinGame();
    });
  }

  /* ---------------- My Study ---------------- */

  // Rough minutes each kind of task takes a student.
  var COST = { read: 5, quick: 0.5, cards: 0.25, practice: 1.5 };
  var MIN_CHOICES = [10, 20, 30, 45, 60];

  function dayStr(d) {
    d = d || new Date();
    return d.getFullYear() + "-" +
      ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function daysUntil(iso) {
    if (!iso) return null;
    var a = new Date(dayStr() + "T00:00:00"), b = new Date(iso + "T00:00:00");
    if (isNaN(b.getTime())) return null;
    return Math.round((b - a) / 86400000);
  }

  // Topics they keep getting wrong, worst first.
  function weakTopics(p) {
    var rows = (S.progress || []).filter(function (r) { return r.pack_id === p.id && r.attempts >= 3; });
    return rows.map(function (r) {
      return { unit: r.unit, rate: r.correct / r.attempts };
    }).filter(function (r) { return r.rate < 0.6; })
      .sort(function (a, b) { return a.rate - b.rate; });
  }

  // Build a day-by-day plan from today to the exam. Recomputed each time so it
  // keeps adapting as they get better or worse at things.
  function buildPlan(p, examDate, minutes) {
    var left = daysUntil(examDate);
    if (left === null) return [];
    var days = Math.max(1, Math.min(left, 60));
    var us = units(p);
    if (!us.length) return [];

    var weak = weakTopics(p).map(function (w) { return w.unit; });
    var order = [];
    for (var d = 0; d < days; d++) {
      // Last quarter of the run goes to whatever they are worst at.
      var useWeak = weak.length && d >= Math.floor(days * 0.75);
      if (useWeak) {
        var wu = us.filter(function (u) { return weak.indexOf(u.name) >= 0; });
        order.push(wu.length ? wu[d % wu.length] : us[d % us.length]);
      } else {
        order.push(us[d % us.length]);
      }
    }

    var hasQuick = (p.quick || []).length, hasCards = (p.cards || []).length,
        hasPractice = (p.practice || []).length;

    return order.map(function (u, i) {
      var budget = minutes, tasks = [];
      tasks.push({ kind: "read", tab: "unit:" + u.index,
        text: "Read through " + u.name, mins: COST.read });
      budget -= COST.read;

      // Closer to the exam, spend some of each day on whatever they keep
      // getting wrong. Practice topics are finer-grained than unit names, so
      // this is named explicitly rather than matched against a unit.
      if (weak.length && i >= Math.floor(days * 0.75) && hasPractice && budget > 4) {
        tasks.push({ kind: "practice", tab: "practice",
          text: "Go again at " + weak[i % weak.length], mins: 4 });
        budget -= 4;
      }

      // Maths-style packs lead with doing; memory packs lead with recall.
      var wants = p.focus === "practice"
        ? [["practice", hasPractice], ["quick", hasQuick], ["cards", hasCards]]
        : [["quick", hasQuick], ["cards", hasCards], ["practice", hasPractice]];

      wants.forEach(function (w) {
        var kind = w[0], available = w[1];
        if (!available || budget <= 0) return;
        var share = budget / 2;
        var n = Math.max(1, Math.min(available, Math.floor(share / COST[kind])));
        if (n < 1) return;
        var label = kind === "practice" ? " practice questions"
                  : kind === "quick" ? " quick questions" : " flashcards";
        tasks.push({ kind: kind, tab: kind, text: n + label, mins: n * COST[kind], n: n });
        budget -= n * COST[kind];
      });

      var date = new Date();
      date.setDate(date.getDate() + i);
      return { day: i, date: dayStr(date), unit: u.name, tasks: tasks };
    });
  }

  function loadStudy(p, then) {
    if (!SB || !S.user) { if (then) then(); return; }
    var got = 0;
    function done() { if (++got === 3 && then) then(); }
    loadQProgress(p, done);
    SB.from("study_plans").select("*")
      .eq("user_id", S.user.id).eq("pack_id", p.id).limit(1)
      .then(function (res) {
        var rows = (res && res.data) || [];
        S.study = rows.length ? rows[0] : null;
        done();
      })["catch"](done);
    SB.from("topic_progress").select("*")
      .eq("user_id", S.user.id).eq("pack_id", p.id)
      .then(function (res) { S.progress = (res && res.data) || []; done(); })["catch"](done);
  }

  function saveStudy(p, fields, then) {
    if (!SB || !S.user) { if (then) then(); return; }
    var row = { user_id: S.user.id, pack_id: p.id };
    for (var k in fields) if (fields.hasOwnProperty(k)) row[k] = fields[k];
    SB.from("study_plans").upsert(row, { onConflict: "user_id,pack_id" }).select()
      .then(function (res) {
        var rows = (res && res.data) || [];
        if (rows.length) S.study = rows[0];
        if (then) then();
      })["catch"](function () { if (then) then(); });
  }

  // Called every time they answer a practice question.
  function recordProgress(p, topic, ok) {
    if (!SB || !S.user || !topic) return;
    var found = null;
    (S.progress || []).forEach(function (r) {
      if (r.pack_id === p.id && r.unit === topic) found = r;
    });
    var row = {
      user_id: S.user.id, pack_id: p.id, unit: topic,
      attempts: (found ? found.attempts : 0) + 1,
      correct: (found ? found.correct : 0) + (ok ? 1 : 0),
      last_seen: new Date().toISOString()
    };
    if (!found) { S.progress = S.progress || []; S.progress.push(row); }
    else { found.attempts = row.attempts; found.correct = row.correct; }
    SB.from("topic_progress").upsert(row, { onConflict: "user_id,pack_id,unit" })
      .then(function () {})["catch"](function () {});
  }

  // Every answer is now remembered per question, not just per unit. Unit
  // level could only say "you are shaky on Algebra"; this can say "these are
  // the six questions you keep getting wrong", which is the whole point.
  function recordAnswer(p, kind, index, unit, ok) {
    if (!SB || !S.user || !p) return;
    if (unit) recordProgress(p, unit, ok);
    var i = parseInt(index, 10);
    if (isNaN(i)) return;
    SB.rpc("record_answer", {
      p_pack: p.id, p_kind: kind, p_index: i,
      p_unit: unit || null, p_correct: !!ok
    }).then(function () {})["catch"](function () {});
  }

  // Pull what the server remembers about this pack's questions.
  function loadQProgress(p, then) {
    if (!SB || !S.user || !p) { S.qp = []; if (then) then(); return; }
    SB.from("question_progress").select("kind,q_index,unit,attempts,correct,run,box,next_due")
      .eq("pack_id", p.id)
      .then(function (res) {
        S.qp = (res && res.data) || [];
        if (then) then();
      })["catch"](function () { S.qp = []; if (then) then(); });
  }

  function qpList() { return S.qp || []; }

  // How ready they are: every question is worth its Leitner box out of 5,
  // and anything never attempted counts as zero. Honest, and it climbs.
  function readiness(p) {
    if (!p) return { pct: 0, seen: 0, total: 0, mastered: 0 };
    var total = (p.quick || []).length + (p.practice || []).length;
    if (!total) return { pct: 0, seen: 0, total: 0, mastered: 0 };
    var sum = 0, seen = 0, mastered = 0;
    qpList().forEach(function (r) {
      if (r.kind !== "quick" && r.kind !== "practice") return;
      seen++;
      var b = Math.max(0, Math.min(5, r.box || 0));
      sum += b / 5;
      if (b >= 4) mastered++;
    });
    return {
      pct: Math.round((sum / total) * 100),
      seen: seen, total: total, mastered: mastered
    };
  }

  // The questions worth their time: wrong recently, or due for review.
  function weakQuestions(p, n) {
    var now = Date.now();
    var rows = qpList().filter(function (r) {
      return (r.kind === "quick" || r.kind === "practice") && r.attempts > 0;
    });
    rows.sort(function (a, b) {
      var ab = (a.box || 0), bb = (b.box || 0);
      if (ab !== bb) return ab - bb;                      // struggling first
      var ar = (a.attempts ? a.correct / a.attempts : 0);
      var br = (b.attempts ? b.correct / b.attempts : 0);
      if (ar !== br) return ar - br;                      // worst hit rate
      return (b.attempts || 0) - (a.attempts || 0);
    });
    return rows.slice(0, n || 10);
  }

  function dueCount(p) {
    var now = Date.now();
    return qpList().filter(function (r) {
      return r.next_due && new Date(r.next_due).getTime() <= now;
    }).length;
  }

  // Does this account get the good study features? The database decides the
  // plan; this only decides what to draw.
  function fullStudy() {
    return ["trial", "plus", "pro"].indexOf(S.plan) >= 0;
  }

  // A number that climbs. Every question is worth its box out of five, so
  // this only moves when they actually get better, not when they click more.
  function readinessPanel(p) {
    var r = readiness(p);
    var tone = r.pct >= 70 ? "" : (r.pct >= 40 ? " mid" : " low");
    var due = dueCount(p);
    return '<div class="ready">' +
      '<div class="readytop"><h3>Exam readiness</h3>' +
        '<span class="readypct">' + r.pct + '%</span></div>' +
      '<div class="readybar"><div class="readyfill' + tone + '" style="width:' + r.pct + '%"></div></div>' +
      '<p class="readysub">' + r.mastered + ' of ' + r.total + ' questions solid &middot; ' +
        r.seen + ' tried' +
        (due ? ' &middot; <strong>' + due + ' due for review</strong>' : "") + '</p>' +
      (r.seen === 0
        ? '<p class="readysub" style="margin-top:6px">Answer some questions and this starts filling in.</p>'
        : "") +
    '</div>';
  }

  function weakDrillPanel(p) {
    var weak = weakQuestions(p, 10);
    if (!weak.length) return "";
    var names = weak.slice(0, 6).map(function (r) {
      var item = (r.kind === "quick" ? (p.quick || [])[r.q_index]
                                     : (p.practice || [])[r.q_index]);
      var t = item ? (item.q || "") : "";
      return '<span class="qchip">' + esc(t.length > 42 ? t.slice(0, 40) + "..." : t) + '</span>';
    }).join("");
    return '<div class="drillbox"><strong>Your weak ' + weak.length + '</strong>' +
      'The exact questions you keep getting wrong. Twenty minutes here beats an hour of rereading.' +
      '<div class="qchips">' + names + '</div>' +
      '<button class="btn btn-primary" onclick="startDrill()">Drill these ' + weak.length + '</button>' +
    '</div>';
  }

  function studyLockedPanel() {
    return '<div class="lockbox">' +
      '<h3>Weak-question drilling and readiness</h3>' +
      '<p>StudyPacks remembers every question you answer and brings the ones you get wrong back, ' +
      'spaced out so they stick. Plus and Pro get it, and every new account gets a week free.</p>' +
      '<button class="btn btn-primary" onclick="go(\'plans\')">See plans</button>' +
    '</div>';
  }

  function trialBar() {
    if (S.plan !== "trial" || !S.trialEnds) return "";
    var days = Math.ceil((new Date(S.trialEnds).getTime() - Date.now()) / 86400000);
    if (days <= 0) return "";
    return '<div class="trialbar"><strong>Free week</strong> &middot; ' +
      days + (days === 1 ? " day" : " days") + ' left of the full version, ' +
      'including weak-question drilling and 3 pack requests a day.</div>';
  }

  // Just the questions they keep missing, run through the normal session.
  window.startDrill = function () {
    var p = pack();
    if (!p || !fullStudy()) return;
    var weak = weakQuestions(p, 10);
    var qidx = [], pidx = [];
    weak.forEach(function (r) {
      if (r.kind === "quick" && (p.quick || [])[r.q_index]) qidx.push(r.q_index);
      if (r.kind === "practice" && (p.practice || [])[r.q_index]) pidx.push(r.q_index);
    });
    var steps = [];
    if (qidx.length) steps.push({ kind: "quick", idx: qidx, text: "Questions you keep missing",
      items: qidx.map(function (i) { return p.quick[i]; }) });
    if (pidx.length) steps.push({ kind: "practice", idx: pidx, text: "Practice you keep missing",
      items: pidx.map(function (i) { return p.practice[i]; }) });
    if (!steps.length) return;
    S.session = { steps: steps, step: 0, i: 0, chosen: null, typed: "", state: null,
                  flipped: false, right: 0, asked: 0, drill: true };
    window.scrollTo(0, 0);
    render();
  };

  /* ---------------- Pro mock exam ---------------- */
  /* The Full exam tab is a written paper you mark yourself. This one is
     built only from questions the site can mark on its own, so it can hand
     back a real score and say which topics lost the marks. */

  function mockUnitOf(item, kind) {
    return (item && (item.unit || item.topic)) || null;
  }

  function buildMock(p) {
    var picks = [];
    (p.quick || []).forEach(function (q, i) { picks.push({ kind: "quick", i: i, item: q }); });
    (p.practice || []).forEach(function (q, i) { picks.push({ kind: "practice", i: i, item: q }); });
    // deterministic-ish shuffle so a retake is not the identical order
    var seed = (S.mockSeed = (S.mockSeed || 1) + 7);
    for (var k = picks.length - 1; k > 0; k--) {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      var j = seed % (k + 1);
      var t = picks[k]; picks[k] = picks[j]; picks[j] = t;
    }
    return picks.slice(0, Math.min(25, picks.length));
  }

  window.startMock = function () {
    var p = pack();
    if (!p || !canMock()) { go("plans"); return; }
    var qs = buildMock(p);
    if (!qs.length) return;
    S.mock = { qs: qs, answers: {}, done: false,
               secondsLeft: Math.max(10, Math.round(qs.length * 1.2)) * 60 };
    stopTimer();
    mockTick();
    window.scrollTo(0, 0);
    render();
  };

  var mockTimerId = null;
  function mockTick() {
    if (mockTimerId) clearInterval(mockTimerId);
    mockTimerId = setInterval(function () {
      if (!S.mock || S.mock.done) { clearInterval(mockTimerId); mockTimerId = null; return; }
      S.mock.secondsLeft--;
      if (S.mock.secondsLeft <= 0) { window.finishMock(); return; }
      var el = document.getElementById("mockClk");
      if (el) el.textContent = mmss(S.mock.secondsLeft);
    }, 1000);
  }

  window.quitMock = function () {
    if (mockTimerId) { clearInterval(mockTimerId); mockTimerId = null; }
    S.mock = null; window.scrollTo(0, 0); render();
  };

  window.finishMock = function () {
    var m = S.mock, p = pack();
    if (!m || m.done) return;
    if (mockTimerId) { clearInterval(mockTimerId); mockTimerId = null; }
    m.done = true;
    m.marked = m.qs.map(function (q, n) {
      var given = m.answers[n];
      var ok;
      if (q.kind === "quick") ok = (given === q.item.answer);
      else ok = (given !== undefined && given !== null && String(given).trim() !== "" &&
                 isRight(q.item, String(given)));
      // every mock answer feeds the same memory the drill uses
      recordAnswer(p, q.kind, q.i, mockUnitOf(q.item, q.kind), ok);
      return { ok: !!ok, unit: mockUnitOf(q.item, q.kind) || "Untagged" };
    });
    window.scrollTo(0, 0);
    render();
  };

  function mockBreakdown(m) {
    var by = {};
    m.marked.forEach(function (r) {
      if (!by[r.unit]) by[r.unit] = { got: 0, out: 0 };
      by[r.unit].out++;
      if (r.ok) by[r.unit].got++;
    });
    return Object.keys(by).map(function (u) {
      return { unit: u, got: by[u].got, out: by[u].out,
               pct: Math.round((by[u].got / by[u].out) * 100) };
    }).sort(function (a, b) { return a.pct - b.pct; });
  }

  function canMock() {
    return S.plan === "pro" || S.plan === "trial";
  }

  function mockView(p) {
    var m = S.mock;

    if (m.done) {
      var got = m.marked.filter(function (r) { return r.ok; }).length;
      var out = m.marked.length;
      var pct = Math.round((got / out) * 100);
      var rows = mockBreakdown(m);
      var untagged = rows.length === 1 && rows[0].unit === "Untagged";
      return '<div class="sheet">' +
        '<span class="kicker">Mock exam</span>' +
        '<h2 style="margin:4px 0 12px">Marked</h2>' +
        '<div class="scorebig">' + pct + '%</div>' +
        '<p class="lead" style="margin:6px 0 0">' + got + ' out of ' + out + ' right.</p>' +
        (untagged
          ? '<p class="help" style="margin-top:12px">This pack\'s questions are not tagged by topic yet, ' +
            'so there is no breakdown. Newer packs are, and they will show one here.</p>'
          : '<h3 style="margin:20px 0 0;font-size:17px">Where the marks went</h3>' +
            '<div class="brk">' + rows.map(function (r) {
              var tone = r.pct >= 70 ? "" : (r.pct >= 40 ? " mid" : " low");
              return '<div class="brkrow"><span class="brkname">' + esc(r.unit) + '</span>' +
                '<span class="brkbar"><span class="brkfill' + tone + '" style="width:' + r.pct + '%"></span></span>' +
                '<span class="brkpct">' + r.pct + '%</span>' +
                '<span class="mwhen">' + r.got + '/' + r.out + '</span></div>';
            }).join("") + '</div>' +
            '<p class="help" style="margin-top:12px">Weakest topic first. Everything you got wrong ' +
            'has gone into your weak questions, so the drill will bring it back.</p>') +
        '<div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">' +
          '<button class="btn btn-primary" onclick="startMock()">Sit another one</button>' +
          '<button class="btn" onclick="quitMock()">Back to My Study</button>' +
        '</div></div>';
    }

    var body = m.qs.map(function (q, n) {
      var given = m.answers[n];
      if (q.kind === "quick") {
        var opts = q.item.options.map(function (o, j) {
          return '<button class="mockopt' + (given === j ? " picked" : "") + '" ' +
            'data-mk="' + n + '" data-mo="' + j + '">' +
            '<strong>' + String.fromCharCode(65 + j) + '</strong> &nbsp;' + esc(o) + '</button>';
        }).join("");
        return '<div class="mockq"><div class="mn">Question ' + (n + 1) + '</div>' +
          '<div class="mq">' + esc(q.item.q) + '</div>' + opts + '</div>';
      }
      return '<div class="mockq"><div class="mn">Question ' + (n + 1) + ' &middot; type your answer</div>' +
        '<div class="mq">' + esc(q.item.q) + '</div>' +
        '<input type="text" data-mt="' + n + '" value="' + esc(given === undefined ? "" : given) + '" ' +
        'placeholder="Your answer"></div>';
    }).join("");

    var answered = Object.keys(m.answers).length;
    return '<div class="timerbar">' +
        '<span class="clock' + (m.secondsLeft <= 120 ? " low" : "") + '" id="mockClk">' +
          mmss(m.secondsLeft) + '</span>' +
        '<span class="lbl">left &middot; ' + answered + ' of ' + m.qs.length + ' answered</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-primary btn-sm" onclick="finishMock()">Finish &amp; mark</button>' +
      '</div>' +
      '<div class="sheet">' + body +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">' +
        '<button class="btn btn-primary btn-lg" onclick="finishMock()">Finish &amp; mark</button>' +
        '<button class="btn" onclick="quitMock()">Give up</button>' +
      '</div></div>';
  }

  function wireMock() {
    Array.prototype.forEach.call(app.querySelectorAll("[data-mk]"), function (b) {
      b.addEventListener("click", function () {
        if (!S.mock || S.mock.done) return;
        S.mock.answers[this.getAttribute("data-mk")] = parseInt(this.getAttribute("data-mo"), 10);
        var y = window.scrollY; render(); window.scrollTo(0, y);
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-mt]"), function (inp) {
      inp.addEventListener("input", function () {
        if (!S.mock || S.mock.done) return;
        S.mock.answers[this.getAttribute("data-mt")] = this.value;
      });
    });
  }

  function mockPanel(p) {
    var n = (p.quick || []).length + (p.practice || []).length;
    if (!n) return "";
    if (!canMock()) {
      return '<div class="lockbox"><h3>Mock exam</h3>' +
        '<p>A timed paper the site marks for you, with a breakdown of which topics lost the marks. ' +
        'Pro, and included in your free week.</p>' +
        '<button class="btn" onclick="go(\'plans\')">See plans</button></div>';
    }
    return '<div class="drillbox" style="background:#fff"><strong>Mock exam</strong>' +
      'A timed paper marked the moment you finish, with a breakdown of which topics lost marks. ' +
      'Everything you get wrong goes straight into your weak questions.' +
      '<div style="margin-top:12px"><button class="btn btn-primary" onclick="startMock()">Sit a mock exam</button></div>' +
    '</div>';
  }

  function streakLine(st) {
    var n = (st && st.streak) || 0;
    if (!n) return "Do today's tasks to start a streak.";
    if (n === 1) return "\u{1F525} 1 day streak - come back tomorrow to keep it.";
    return "\u{1F525} " + n + " day streak. Do not break it now.";
  }

  function taskList(day, live) {
    return '<ul class="tasks">' + day.tasks.map(function (t) {
      return '<li><span class="tk">' + esc(t.text) + '</span>' +
        '<span class="tkm">' + Math.round(t.mins) + ' min</span>' +
        (live ? '<button class="linkbtn" onclick="tab(\'' + t.tab + '\')">Go</button>' : '') +
      '</li>';
    }).join("") + '</ul>';
  }

  /* ---------------- the guided session ---------------- */
  /* The point of My Study is that a student who does not know what to do is
     told exactly what to do, one thing at a time, and never has to choose. */

  // Take n items, shifted along each day so they do not see the same ones.
  function pickN(list, n, offset) {
    if (!list || !list.length) return [];
    n = Math.min(n || 1, list.length);
    var out = [];
    for (var k = 0; k < n; k++) out.push(list[((offset * n) + k) % list.length]);
    return out;
  }

  // The positions, not the items. Needed so the session can record which
  // question was answered, not just that one was.
  function pickIdx(list, n, offset) {
    if (!list || !list.length) return [];
    n = Math.min(n || 1, list.length);
    var out = [];
    for (var k = 0; k < n; k++) out.push(((offset * n) + k) % list.length);
    return out;
  }

  // Anything the server says is due comes first, so the day's questions are
  // the ones actually going stale rather than the next ones along.
  function pickDueFirst(list, kind, n, offset) {
    if (!list || !list.length) return [];
    n = Math.min(n || 1, list.length);
    var now = Date.now(), due = [];
    if (fullStudy()) {
      qpList().forEach(function (r) {
        if (r.kind !== kind) return;
        if (r.q_index === null || r.q_index === undefined) return;
        if (r.q_index >= list.length) return;
        if (r.next_due && new Date(r.next_due).getTime() <= now) due.push(r);
      });
      due.sort(function (a, b) { return (a.box || 0) - (b.box || 0); });
    }
    var out = [];
    for (var i = 0; i < due.length && out.length < n; i++) out.push(due[i].q_index);
    var filler = pickIdx(list, list.length, offset);
    for (var j = 0; j < filler.length && out.length < n; j++) {
      if (out.indexOf(filler[j]) < 0) out.push(filler[j]);
    }
    return out.slice(0, n);
  }

  window.startSession = function () {
    if (!fullStudy()) { go("plans"); return; }
    var p = pack();
    var st = S.study || {};
    var plan = buildPlan(p, st.exam_date, st.minutes_a_day || 20);
    var today = plan[0];
    if (!today) return;

    // shift the questions along based on how many days they have studied
    var offset = (st.streak || 0);
    var steps = [];
    today.tasks.forEach(function (t) {
      if (t.kind === "read") {
        steps.push({ kind: "read", unit: parseInt(t.tab.split(":")[1], 10), text: t.text });
      } else if (t.kind === "quick") {
        var qi = pickDueFirst(p.quick, "quick", t.n, offset);
        steps.push({ kind: "quick", idx: qi, text: t.text,
          items: qi.map(function (i) { return p.quick[i]; }) });
      } else if (t.kind === "cards") {
        steps.push({ kind: "cards", items: pickN(p.cards, t.n, offset), text: t.text });
      } else if (t.kind === "practice") {
        var pi = pickDueFirst(p.practice, "practice", t.n, offset);
        steps.push({ kind: "practice", idx: pi, text: t.text,
          items: pi.map(function (i) { return p.practice[i]; }) });
      }
    });
    steps = steps.filter(function (s) { return s.kind === "read" || (s.items && s.items.length); });
    if (!steps.length) return;

    S.session = { steps: steps, step: 0, i: 0, chosen: null, typed: "", state: null,
                  flipped: false, right: 0, asked: 0 };
    window.scrollTo(0, 0);
    render();
  };

  window.quitSession = function () {
    S.session = null; window.scrollTo(0, 0); render();
  };

  // Move to the next item, or the next step, or finish.
  window.sessNext = function () {
    var z = S.session; if (!z) return;
    var step = z.steps[z.step];
    var len = step.items ? step.items.length : 1;
    if (z.i + 1 < len && step.kind !== "read") {
      z.i++; z.chosen = null; z.typed = ""; z.state = null; z.flipped = false;
    } else {
      z.step++; z.i = 0; z.chosen = null; z.typed = ""; z.state = null; z.flipped = false;
      if (z.step >= z.steps.length) { finishSession(); return; }
    }
    window.scrollTo(0, 0);
    render();
  };

  function finishSession() {
    var p = pack(), st = S.study || {};
    var today = dayStr();
    var yest = new Date(); yest.setDate(yest.getDate() - 1);
    var streak = (st.last_studied === today) ? (st.streak || 0)
               : (st.last_studied === dayStr(yest)) ? (st.streak || 0) + 1 : 1;
    S.session.finished = true;
    saveStudy(p, { last_studied: today, streak: streak }, function () { render(); });
  }

  function sessionDoneView(p) {
    var z = S.session, st = S.study || {};
    var left = daysUntil(st.exam_date);

  function sessionView(p) {

  function wireSession(p) {
    var z = S.session; if (!z) return;
    var step = z.steps[z.step]; if (!step) return;

    if (step.kind === "quick") {
      Array.prototype.forEach.call(app.querySelectorAll("[data-sq]"), function (b) {
        b.addEventListener("click", function () {
          if (z.chosen !== null) return;
          z.chosen = parseInt(this.getAttribute("data-sq"), 10);
          var sq = step.items[z.i];
          var sok = (z.chosen === sq.answer);
          z.asked++; if (sok) z.right++;
          recordAnswer(p, "quick", step.idx ? step.idx[z.i] : z.i,
                       sq.unit || sq.topic || null, sok);
          var y = window.scrollY; render(); window.scrollTo(0, y);
        });
      });
    }

    if (step.kind === "cards") {
      var f = document.getElementById("sessFlip"), card = document.getElementById("sessCard");
      function flip() { z.flipped = true; var y = window.scrollY; render(); window.scrollTo(0, y); }
      if (f) f.addEventListener("click", flip);
      if (card && !z.flipped) card.addEventListener("click", flip);
    }

    if (step.kind === "practice") {
      var inp = document.getElementById("sessIn");
      var it = step.items[z.i];
      function check() {
        if (!inp) return;
        var ok = isRight(it, inp.value);
        z.typed = inp.value; z.state = { ok: ok };
        z.asked++; if (ok) z.right++;
        recordAnswer(p, "practice", step.idx ? step.idx[z.i] : z.i, it.topic, ok);
        var y = window.scrollY; render(); window.scrollTo(0, y);
      }
      var c = document.getElementById("sessCheck");
      if (c) c.addEventListener("click", check);
      var s = document.getElementById("sessSkip");
      if (s) s.addEventListener("click", function () { window.sessNext(); });
      if (inp) {
        inp.addEventListener("keydown", function (e) {
          if (e.key !== "Enter") return;
          e.preventDefault();
          if (z.state) window.sessNext(); else check();
        });
        if (!z.state) inp.focus();
      }
    }
  }

    if (S.plan === "free") return '<p class="lead">You are on <strong>Free</strong>.</p>';

  function loadPlan(then) {
    if (!SB || !S.user) {
      S.plan = "free";
      S.planLockedUntil = null;
      if (then) then();
      return;
    }
    // The database works out the plan, including whether the free trial is
    // still running and whether a paid plan has quietly expired. The page
    // just repeats the answer.
    SB.rpc("my_plan").then(function (res) {
      var d = (res && !res.error && res.data) || null;
      if (d) {
        S.plan = d.plan || "free";
        S.planExpires = d.expires_at || null;
        S.trialEnds = d.trial_ends || null;
        S.planLapsed = !!d.lapsed;
      } else {
        S.plan = "free"; S.trialEnds = null;
      }
      // locked_until still comes from the row itself
      SB.from("user_plans").select("locked_until").eq("user_id", S.user.id).limit(1)
        .then(function (r2) {
          var row = r2 && r2.data && r2.data[0];
          S.planLockedUntil = row ? (row.locked_until || null) : null;
          if (then) then();
        })["catch"](function () { S.planLockedUntil = null; if (then) then(); });
    })["catch"](function () {
      S.plan = "free"; S.trialEnds = null;
      if (then) then();
    });
  }

    if (m.indexOf("already registered") >= 0 || m.indexOf("already been registered") >= 0)
      return "There is already an account with that email. Try signing in instead.";
    if (m.indexOf("password") >= 0 && m.indexOf("6") >= 0)
      return "Your password needs to be at least 6 characters.";
    if (m.indexOf("email") >= 0 && m.indexOf("valid") >= 0)
      return "That does not look like a real email address.";
    if (m.indexOf("confirm") >= 0)
      return "Confirm your email first - check your inbox for the link.";

            '<button class="linkbtn" id="backIn">Back to sign in</button></p>' +
        '</div></div>';
    }

    /* ---- normal sign in / sign up ---- */

        '<h1>' + (signup ? "Make an account" : "Welcome back") + '</h1>' +
        '<p>' + (signup
          ? "So your packs, your study plan and your streak follow you from your phone to your laptop."
          : "Sign in to pick up where you left off.") + '</p>' +
      '</section>' +
      '<div class="panel"><div class="sheet authcard">' +
        '<div class="authtabs">' +
          '<button id="tabIn" class="' + (signup ? "" : "on") + '">Sign in</button>' +
          '<button id="tabUp" class="' + (signup ? "on" : "") + '">Create account</button>' +
        '</div>' +
        googleButton() +
        (signup ? '<div class="field"><label for="aName">Your name</label>' +
          '<input id="aName" placeholder="What should I call you?"></div>' : "") +
        '<div class="field"><label for="aEmail">Email</label>' +
          '<input id="aEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>' +
        '<div class="field"><label for="aPass">Password</label>' +
          (signup ? '<p class="help">At least 6 characters.</p>' : "") +
          '<input id="aPass" type="password" autocomplete="' +
            (signup ? "new-password" : "current-password") + '" placeholder="Your password"></div>' +
        '<button class="btn btn-primary btn-lg" id="aGo">' +
          (signup ? "Create my account" : "Sign in") + '</button>' + msg +
        (signup ? "" : '<p class="help" style="margin-top:14px">' +
          '<button class="linkbtn" id="forgotLink">Forgotten your password?</button></p>') +
      '</div></div>';

  function wireAuth() {
    var mode = S.authTab || "signin";
    var i = document.getElementById("tabIn"), u = document.getElementById("tabUp");
    if (i) i.addEventListener("click", function () { window.authTab("signin"); });
    if (u) u.addEventListener("click", function () { window.authTab("signup"); });

    var f = document.getElementById("forgotLink");
    if (f) f.addEventListener("click", function () { window.authTab("forgot"); });
    var back = document.getElementById("backIn");
    if (back) back.addEventListener("click", function () { window.authTab("signin"); });

    var b = document.getElementById("aGo");
    if (b) b.addEventListener("click", function () {
      if (mode === "forgot") sendReset();
      else if (mode === "newpass") saveNewPassword();
      else submitAuth();
    });

    ["aPass", "aEmail"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        e.preventDefault();
        if (mode === "forgot") sendReset();
        else if (mode === "newpass") saveNewPassword();
        else submitAuth();
      });
    });
    var first = document.getElementById(mode === "newpass" ? "aPass" : "aEmail");
    if (first && !S.authMsg) first.focus();
  }

  function sendReset() {
    var email = val("aEmail");
    if (!email) {
      S.authMsg = { ok: false, text: "Put your email in first." };
      render(); return;
    }
    var btn = document.getElementById("aGo");
    if (btn) { btn.disabled = true; btn.textContent = "Sending..."; }

    SB.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL })
      .then(function (res) {
        // Always says the same thing, so nobody can use this to find out
        // which email addresses have accounts.
        S.authMsg = { ok: true,
          text: "If there is an account for that email, a link is on its way. " +
                "Check your inbox, and your junk folder." };
        render();
      })["catch"](function () {
        S.authMsg = { ok: false, text: "Could not send that just now. Try again in a minute." };
        render();
      });
  }

  function saveNewPassword() {
    var pass = val("aPass");
    if (pass.length < 6) {
      S.authMsg = { ok: false, text: "Needs to be at least 6 characters." };
      render(); return;
    }
    var btn = document.getElementById("aGo");
    if (btn) { btn.disabled = true; btn.textContent = "Saving..."; }

    SB.auth.updateUser({ password: pass }).then(function (res) {
      if (res && res.error) {
        S.authMsg = { ok: false, text: friendlyAuthError(res.error.message) };
        render(); return;
      }
      S.authTab = "signin";
      S.authMsg = null;
      try { history.replaceState({}, "", location.pathname); } catch (e) {}
      go("library");
    })["catch"](function () {
      S.authMsg = { ok: false, text: "Could not save that. Try the link in your email again." };
      render();
    });
  }

  function submitAuth() {
    if (!SB) {
      S.authMsg = { ok: false, text: "Accounts are not connected yet." };
      render(); return;
    }
    var email = val("aEmail"), pass = val("aPass"), name = val("aName");
    if (!email || !pass) {
      S.authMsg = { ok: false, text: "Fill in your email and your password." };
      render(); return;
    }
    var signup = S.authTab === "signup";
    var btn = document.getElementById("aGo");
    if (btn) { btn.disabled = true; btn.textContent = "One moment..."; }

    var p = signup
      ? SB.auth.signUp({
          email: email,
          password: pass,
          options: {
            data: { full_name: name },
            emailRedirectTo: "https://sw573bfk-beep.github.io/studypacks/"
          }
        })
      : SB.auth.signInWithPassword({ email: email, password: pass });

    p.then(function (res) {
      if (res.error) {
        S.authMsg = { ok: false, text: friendlyAuthError(res.error.message) };
        render(); return;
      }
      if (res.data && res.data.session) {
        S.user = res.data.session.user;
        S.authMsg = null;
        var next = S.afterAuth || "library";
        S.afterAuth = null;
        loadPlan(function () { updateAuthArea(); go(next); });
      } else {
        S.authMsg = { ok: true,
          text: "Almost there - check your email for a confirmation link, then come back and sign in." };
        render();
      }
    })["catch"](function () {
      S.authMsg = { ok: false, text: "Could not reach the server. Check your connection and try again." };
      render();
    });
  }

  /* ---------------- your requests, for you only ---------------- */

  function adminView() {
    document.documentElement.removeAttribute("data-theme");
    bannerEl.innerHTML = ""; navEl.innerHTML = "";
    if (!isAdmin()) {
      return '<div class="panel"><div class="sheet"><div class="authmsg bad">' +
        'This page is only for the account that runs StudyPacks.</div></div></div>';
    }
    var rows = S.adminRows;
    var body, doneBox = "";
    if (rows === null || rows === undefined) {
      body = '<p class="help">Loading requests...</p>';
    } else {
      // Done ones leave this list entirely and live in the box at the bottom.
      var live = [], done = [], i;
      for (i = 0; i < rows.length; i++) {
        if (rows[i].status === "done") done.push(rows[i]);
        else live.push(rows[i]);
      }
      if (live.length) {
        body = live.map(function (r) { return requestRow(r); }).join("");
      } else if (done.length) {
        body = '<p class="help">All caught up. Everything you have finished is in the box below.</p>';
      } else {
        body = '<p class="help">No requests yet. They will show up here as students send them.</p>';
      }
      doneBox = finishedPanel(done);
    }

    return '<section class="hero" style="padding-bottom:0"><h1>Admin</h1>' +
      '<p>Pack requests and plan codes. Only you can see this page.</p></section>' +
      '<div class="panel">' +
        '<div class="sheet" style="margin-bottom:18px">' +
          '<span class="kicker">Requests</span><h2>What students have asked for</h2>' +
          body +
          doneBox +
        '</div>' +
        usagePanel() +
        membersPanel() +
        codesPanel() +
      '</div>';
  }

  // One request. Same card whether it is live or finished - only the
  // button on the bottom changes.
  function requestRow(r) {
    var isDone = r.status === "done";
    var when = "";
    try { when = new Date(r.created_at).toLocaleString(); } catch (e) {}
    return '<div class="reqrow">' +
      '<h4>' + esc(r.subject || "(no subject)") + " &middot; " + esc(r.year_level || "?") +
        '<span class="pill' + (isDone ? " done" : "") + '">' + esc(r.status || "new") + '</span>' +
        (r.flagged ? '<span class="pill flag" title="Worth a read before you build it">' +
          esc(r.flagged === "unchecked" ? "not checked" : r.flagged) + '</span>' : "") + '</h4>' +
      '<div class="reqmeta">' + esc(r.name || "(no name)") +
        (r.contact ? " &middot; " + esc(r.contact) : "") +
        (when ? " &middot; " + esc(when) : "") + '</div>' +
      '<details><summary class="linkbtn">See what they asked for</summary>' +
        '<div style="margin-top:10px;font-size:14px;white-space:pre-wrap">' +
          esc((r.exam_info ? "Exam: " + r.exam_info + "\n\n" : "") +
              "On the exam:\n" + (r.topics || "(not given)") +
              (r.stuck_on ? "\n\nStuck on:\n" + r.stuck_on : "") +
              (r.notes ? "\n\nTheir notes:\n" + r.notes : "")) +
        '</div></details>' +
      '<div style="margin-top:10px">' +
        (isDone
          ? '<button class="linkbtn undone" data-id="' + esc(r.id) +
              '">Put back on the list</button>'
          : '<button class="btn btn-sm markdone" data-id="' + esc(r.id) +
              '">Mark as done</button>') +
      '</div>' +
    '</div>';
  }

  // The finished pile. Shut by default so the live list stays the thing
  // you look at, but nothing is ever actually thrown away.
  function finishedPanel(done) {
    if (!done.length) return "";
    return '<details class="donebox"' + (S.doneOpen ? " open" : "") + ' id="donebox">' +
      '<summary>Finished packs (' + done.length + ')</summary>' +
      '<div class="inner">' +
        done.map(function (r) { return requestRow(r); }).join("") +
        '<p class="help" style="margin-top:4px">Marked done, so they are out of the way. ' +
        'Put one back if you clicked it by mistake.</p>' +
      '</div></details>';
  }

  // A number with a bar under it.
  function usageMeter(label, big, rest, frac) {
    if (!isFinite(frac) || frac < 0) frac = 0;
    var pct = Math.min(100, frac * 100);
    var tone = pct >= 90 ? " bad" : (pct >= 70 ? " warn" : "");
    return '<div class="usecard"><div class="uselab">' + esc(label) + '</div>' +
      '<div class="usenum">' + esc(String(big)) + ' <small>' + esc(rest) + '</small></div>' +
      '<div class="usebar"><div class="usefill' + tone + '" style="width:' +
        pct.toFixed(1) + '%"></div></div></div>';
  }

  // A number with no limit worth drawing.
  function usageCount(label, big, rest) {
    return '<div class="usecard"><div class="uselab">' + esc(label) + '</div>' +
      '<div class="usenum">' + esc(String(big)) + '</div>' +
      '<div class="uselab" style="margin:6px 0 0">' + esc(rest) + '</div></div>';
  }

  // What is left of the free plans. Every number here is worked out by our
  // own database, so there is no key in this page for anyone to find. The
  // numbers only the outside services know are links, not guesses.
  function usagePanel() {
    var u = S.usage;
    var head = '<span class="kicker">Usage</span><h2>How much of the free plans is gone</h2>';

    if (u === null || u === undefined) {
      return '<div class="sheet" style="margin-bottom:18px">' + head +
        '<p class="help">Checking...</p></div>';
    }
    if (u.error) {
      return '<div class="sheet" style="margin-bottom:18px">' + head +
        '<div class="authmsg bad">' + esc(u.error) + '</div></div>';
    }

    var dbMb = u.db_bytes / 1048576;
    var dbLimit = u.db_limit_bytes / 1048576;

    var cards = '<div class="usegrid">' +
      usageMeter("Database", dbMb.toFixed(1), "MB of " + Math.round(dbLimit), dbMb / dbLimit) +
      usageMeter("Emails this month", u.requests_month, "of " + u.email_limit,
        u.requests_month / u.email_limit) +
      usageMeter("Codes handed out", u.codes_used, "of " + u.codes_total,
        u.codes_total ? u.codes_used / u.codes_total : 0) +
      usageCount("Students signed up", u.signups, u.signups_month + " joined this month") +
      usageCount("Paying right now", u.members_active,
        u.requests_open + (u.requests_open === 1 ? " request" : " requests") + " still waiting") +
      usageCount("Games hosted", u.games_total, u.players_total + " players all up") +
      '</div>';

    // The one that actually bites: a free project goes to sleep after a
    // quiet week and the site stops working until it is woken up.
    var warn = "";
    if (u.idle_days === null || u.idle_days === undefined) {
      warn = '<div class="usewarn">Nothing has happened on the site yet. Supabase puts a free ' +
        'project to sleep after 7 quiet days, and while it is asleep nobody can sign in or ' +
        'load a pack. Opening the site yourself is enough to reset that.</div>';
    } else if (u.idle_days >= 5) {
      warn = '<div class="usewarn bad"><strong>Quiet for ' + u.idle_days + ' days.</strong> ' +
        'Supabase puts a free project to sleep after 7, and the whole site stops working until ' +
        'you wake it up from the dashboard. Sign in or open a pack today to reset the clock.</div>';
    } else if (u.idle_days >= 3) {
      warn = '<div class="usewarn">Quiet for ' + u.idle_days + ' days. Supabase sleeps a free ' +
        'project after 7. Anything at all happening on the site resets that.</div>';
    }

    return '<div class="sheet" style="margin-bottom:18px">' + head +
      '<p class="lead">Everything here is free, but each part has a ceiling. ' +
      'This is how close you are to any of them.</p>' +
      cards + warn +
      '<p class="help" style="margin-top:14px"><strong>Emails</strong> is counted from requests, ' +
      'because one request sends one email. Web3Forms does not publish a way to read the real ' +
      'figure, so treat it as very close rather than exact. Bandwidth and monthly active users ' +
      'are only visible in the Supabase dashboard - reading them from this page would mean ' +
      'putting a key in it that anyone could take.</p>' +
      '<div class="uselinks">' +
        '<a href="https://supabase.com/dashboard/project/lznicfktnxgnlyhrzazd/settings/billing/usage" ' +
          'target="_blank" rel="noopener">Supabase usage &rarr;</a>' +
        '<a href="https://web3forms.com/dashboard" target="_blank" rel="noopener">Web3Forms &rarr;</a>' +
        '<a href="https://github.com/sw573bfk-beep/studypacks" target="_blank" rel="noopener">The code &rarr;</a>' +
      '</div></div>';
  }

  // Who is paying, until when, and the two buttons that matter.

    var rows = S.memberRows;
    var head = '<span class="kicker">Members</span><h2>Who is on a plan</h2>';

    if (rows === null || rows === undefined) {
      return '<div class="sheet" style="margin-bottom:18px">' + head +
        '<p class="help">Loading...</p></div>';

      return '<div class="sheet" style="margin-bottom:18px">' + head +

    }
    var paying = rows.filter(function (r) { return r.active; });
    if (!rows.length) {
      return '<div class="sheet" style="margin-bottom:18px">' + head +
        '<p class="help">Nobody has redeemed a code yet.</p></div>';

    var list = rows.map(function (r) {
      var when = r.expires_at ? niceDate(r.expires_at) : null;

            (r.days_left <= 5 ? '</strong>' : '') + ' &middot; ' + esc(when || "") + '</span>'
        : '<span class="pill done">free</span><span class="mwhen">' +
          (r.expires_at ? "ran out " + esc(when) : "never paid") + '</span>';

        esc(S.memberMsg.text) + '</div>' : "") +

  // The codes live behind a server check - the browser is not allowed near
  // that table, so this asks the database and it decides whether to answer.
  function codesPanel() {
    var s = S.codeSummary, rows = S.codeRows;
    var head = '<span class="kicker">Plan codes</span><h2>Codes</h2>';

    if (rows === null || rows === undefined) {
      return '<div class="sheet">' + head + '<p class="help">Loading codes...</p></div>';
    }
    if (rows.error) {
      return '<div class="sheet">' + head + '<div class="authmsg bad">' + esc(rows.error) + '</div></div>';
    }

    var tally = s
      ? '<p class="lead">' + s.total + ' codes &middot; <strong>' + s.used + ' used</strong> &middot; ' +
        s.plus_left + ' Plus and ' + s.pro_left + ' Pro still free.</p>'
      : "";

    if (!rows.length) return '<div class="sheet">' + head + tally +
      '<p class="help">No codes yet.</p></div>';

    var list = rows.map(function (c) {
      var used = !!c.used_at;
      var when = "";
      if (used) { try { when = new Date(c.used_at).toLocaleDateString(); } catch (e) {} }
      return '<li class="coderow' + (used ? " used" : "") + '">' +
        '<span class="codeval">' + esc(c.code) + '</span>' +
        '<span class="pill' + (used ? " done" : "") + '">' + esc(c.plan) + '</span>' +
        '<span class="codewho">' +
          (used ? esc(c.used_by_email || "used") + (when ? " &middot; " + esc(when) : "")
                : "not used yet") +
        '</span></li>';
    }).join("");

    return '<div class="sheet">' + head + tally +
      '<ul class="codelist">' + list + '</ul>' +
      '<p class="help" style="margin-top:12px">Give a code to a student and they enter it on the Plans page. ' +
      'Each one works once.</p></div>';
  }

  function wireAdmin() {
    Array.prototype.forEach.call(document.querySelectorAll(".markdone"), function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-id");
        b.disabled = true; b.textContent = "Saving...";
        SB.from("requests").update({ status: "done" }).eq("id", id).then(function () {
          loadAdmin(); loadUsage();
        });
      });
    });
    // Undo, for when it was the wrong one.
    Array.prototype.forEach.call(document.querySelectorAll(".undone"), function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-id");
        b.disabled = true; b.textContent = "Putting back...";
        S.doneOpen = true;
        SB.from("requests").update({ status: "new" }).eq("id", id).then(function () {
          loadAdmin(); loadUsage();
        });
      });
    });
    // Remember whether the finished box was open, so a save does not shut it.
    var dbox = document.getElementById("donebox");
    if (dbox) {
      dbox.addEventListener("toggle", function () { S.doneOpen = dbox.open; });
    }
    Array.prototype.forEach.call(document.querySelectorAll(".mem"), function (b) {
      b.addEventListener("click", function () {
        var uid = b.getAttribute("data-u"), action = b.getAttribute("data-a");
        if (action === "expire" &&
            !window.confirm("End this person's plan now? They go back to Free straight away.")) return;
        b.disabled = true; b.textContent = "...";
        SB.rpc("admin_set_membership", { p_user: uid, p_action: action })
          .then(function (res) {
            var r = (res && res.data) || {};
            S.memberMsg = { ok: !!r.ok, text: r.message || "Done." };
            S.memberRows = null;
            loadMembers();
          })["catch"](function () {
            S.memberMsg = { ok: false, text: "That did not save. Try again." };
            render();
          });
      });
    });
    if (S.adminRows === null || S.adminRows === undefined) loadAdmin();
    if (S.codeRows === null || S.codeRows === undefined) loadCodes();
    if (S.memberRows === null || S.memberRows === undefined) loadMembers();
    if (S.usage === null || S.usage === undefined) loadUsage();
  }

  function loadUsage() {
    if (!SB || !isAdmin()) return;
    SB.rpc("admin_usage_stats").then(function (res) {
      if (res && res.error) S.usage = { error: "Could not work out the usage." };
      else S.usage = (res && res.data) || { error: "Could not work out the usage." };
      if (S.view === "admin") { app.innerHTML = adminView(); wireAdmin(); }
    })["catch"](function () {
      S.usage = { error: "Could not reach the server." };
      if (S.view === "admin") { app.innerHTML = adminView(); wireAdmin(); }
    });
  }

  function loadMembers() {
    if (!SB || !isAdmin()) return;
    SB.rpc("admin_list_members").then(function (res) {
      if (res && res.error) S.memberRows = { error: "Could not load members." };
      else S.memberRows = (res && res.data) || [];
      if (S.view === "admin") { app.innerHTML = adminView(); wireAdmin(); }
    })["catch"](function () {
      S.memberRows = { error: "Could not reach the server." };
      if (S.view === "admin") { app.innerHTML = adminView(); wireAdmin(); }
    });
  }

  function loadAdmin() {
    if (!SB || !isAdmin()) return;
    SB.from("requests").select("*").order("created_at", { ascending: false }).limit(200)
      .then(function (res) {
        S.adminRows = (res && res.data) || [];
        if (S.view === "admin") { app.innerHTML = adminView(); wireAdmin(); }
      });
  }

  function loadCodes() {
    if (!SB || !isAdmin()) return;
    SB.rpc("admin_plan_code_summary").then(function (sres) {
      S.codeSummary = (sres && !sres.error) ? sres.data : null;
      SB.rpc("admin_list_plan_codes").then(function (res) {
        if (res && res.error) S.codeRows = { error: "Could not load the codes." };
        else S.codeRows = (res && res.data) || [];
        if (S.view === "admin") { app.innerHTML = adminView(); wireAdmin(); }
      })["catch"](function () {
        S.codeRows = { error: "Could not reach the server." };
        if (S.view === "admin") { app.innerHTML = adminView(); wireAdmin(); }
      });
    })["catch"](function () { S.codeSummary = null; });
  }
